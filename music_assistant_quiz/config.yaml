name: Music Assistant (Quiz Test)
version: 2.11.0.dev5
slug: music_assistant_quiz
description: Test build of Music Assistant with the Music Quiz "Title Reveal" game.
  Built from justinladwig/ma_server and justinladwig/ma_frontend (branch music-quiz-title-reveal).
url: https://github.com/justinladwig/ma_quiz_addon
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant (Quiz Test)
panel_admin: false
uart: false
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
  - library.db.backup
stage: experimental
image: ghcr.io/justinladwig/music-assistant-quiz
tmpfs: true
options:
  log_level: info
  safe_mode: false
  spotify_client_id: ""
  app_vars: []
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
  spotify_client_id: str?
  app_vars:
    - str
