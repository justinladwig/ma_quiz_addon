configuration:
  log_level:
    name: Log Level
    description: "Set the (global) log level (NOTE: only enable debug when needed)."
  safe_mode:
    name: Safe mode
    description: "Start the Music Assistant server in safe mode where only the core controllers are started without any providers, to troubleshoot issues"
  spotify_client_id:
    name: Spotify client ID
    description: "Client ID of your own Spotify developer app (redirect URI https://music-assistant.io/callback). Needed because this test build has no bundled Spotify credentials."
  app_vars:
    name: Extra app variables
    description: "Further credentials as name=value, for example tidal_client_id_v2=... (see APP_VAR_NAMES in music_assistant/helpers/app_vars.py)."
